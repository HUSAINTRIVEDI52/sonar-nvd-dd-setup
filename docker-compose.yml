version: '3.8'

services:
  # SonarQube
  sonarqube:
    image: sonarqube:lts-community
    container_name: sonarqube
    ports:
      - "9000:9000"
    networks:
      - devsecops
    environment:
      - SONAR_JDBC_URL=jdbc:postgresql://db:5432/sonar
      - SONAR_JDBC_USERNAME=sonar
      - SONAR_JDBC_PASSWORD=${SONAR_DB_PASSWORD}
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    depends_on:
      - db

  # Database for both SonarQube and DefectDojo (Simplified)
  db:
    image: postgres:15
    container_name: devsecops-db
    networks:
      - devsecops
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # DefectDojo (Simplified version of the official compose)
  # In a production setup, DefectDojo has many more components (uwsgi, django, workers, celery, redis/rabbitmq)
  # For this task, I'll provide a functional simplified version or use the official docker-compose with some tweaks.
  # Let's use a more robust DefectDojo setup.
  
  defectdojo:
    image: defectdojo/defectdojo-django:latest
    container_name: defectdojo
    ports:
      - "8080:8080"
    networks:
      - devsecops
    environment:
      - DD_DATABASE_URL=postgres://dojo:${DOJO_DB_PASSWORD}@db:5432/dojo
      - DD_SECRET_KEY=${DD_SECRET_KEY}
      - DD_NVD_API_KEY=${NVD_API_KEY}
    depends_on:
      - db
      - redis

  redis:
    image: redis:7
    container_name: devsecops-redis
    networks:
      - devsecops

networks:
  devsecops:
    driver: bridge

volumes:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  postgres_data:
  defectdojo_data:
