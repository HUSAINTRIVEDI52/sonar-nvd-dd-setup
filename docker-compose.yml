version: '3.8'

services:
  # Database for both SonarQube and DefectDojo
  db:
    image: postgres:15
    container_name: devsecops-db
    networks:
      - devsecops
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # SonarQube
  sonarqube:
    image: sonarqube:lts-community
    container_name: sonarqube
    ports:
      - "9000:9000"
    networks:
      - devsecops
    environment:
      - SONAR_JDBC_URL=jdbc:postgresql://db:5432/postgres
      - SONAR_JDBC_USERNAME=postgres
      - SONAR_JDBC_PASSWORD=${DB_PASSWORD}
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    depends_on:
      db:
        condition: service_healthy

  # DefectDojo Core
  defectdojo:
    image: defectdojo/defectdojo-django:latest
    container_name: defectdojo
    ports:
      - "8080:8080"
    networks:
      - devsecops
    environment:
      - DD_DATABASE_URL=postgres://postgres:${DB_PASSWORD}@db:5432/postgres
      - DD_SECRET_KEY=${DD_SECRET_KEY}
      - DD_NVD_API_KEY=${NVD_API_KEY}
      - DD_CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  # DefectDojo Worker (Required for NVD sync and report processing)
  defectdojo-worker:
    image: defectdojo/defectdojo-django:latest
    container_name: defectdojo-worker
    command: /usr/local/bin/uwsgi --bundle-uwsgi-worker-all-apps --entry-point defectdojo.celery:app
    networks:
      - devsecops
    environment:
      - DD_DATABASE_URL=postgres://postgres:${DB_PASSWORD}@db:5432/postgres
      - DD_CELERY_BROKER_URL=redis://redis:6379/0
      - DD_SECRET_KEY=${DD_SECRET_KEY}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  redis:
    image: redis:7
    container_name: devsecops-redis
    networks:
      - devsecops

networks:
  devsecops:
    driver: bridge

volumes:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  postgres_data: