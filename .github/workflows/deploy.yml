name: Deploy to GCP VM

on:
  push:
    branches:
      - main
      - test

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Generate .env file
        run: |
          echo "SONAR_DB_PASSWORD=${{ secrets.SONAR_DB_PASSWORD }}" > .env
          echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
          echo "DOJO_DB_PASSWORD=${{ secrets.DOJO_DB_PASSWORD }}" >> .env
          echo "DD_SECRET_KEY=${{ secrets.DD_SECRET_KEY }}" >> .env
          echo "NVD_API_KEY=${{ secrets.NVD_API_KEY }}" >> .env

      - name: Pre-flight Check
        run: |
          if [ -z "${{ secrets.GCP_PROJECT_ID }}" ]; then echo "Error: GCP_PROJECT_ID is not set"; exit 1; fi
          if [ -z "${{ secrets.GCP_VM_NAME }}" ]; then echo "Error: GCP_VM_NAME is not set"; exit 1; fi
          if [ -z "${{ secrets.GCP_ZONE }}" ]; then echo "Error: GCP_ZONE is not set"; exit 1; fi

      - name: Configure gcloud
        run: |
          gcloud config set project ${{ secrets.GCP_PROJECT_ID }}
          gcloud config set compute/zone ${{ secrets.GCP_ZONE }}
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

      - name: Package files
        run: |
          tar -czvf deploy.tar.gz docker-compose.yml deploy.sh .env

      - name: Copy package to VM
        run: |
          gcloud compute scp deploy.tar.gz ${{ secrets.GCP_VM_NAME }}:~/ --quiet --tunnel-through-iap

      - name: Extract and Run Deployment
        run: |
          gcloud compute ssh ${{ secrets.GCP_VM_NAME }} --quiet --tunnel-through-iap --command "
            mkdir -p ~/setup-pipeline && \
            tar -xzvf ~/deploy.tar.gz -C ~/setup-pipeline/ && \
            chmod +x ~/setup-pipeline/deploy.sh && \
            cd ~/setup-pipeline/ && \
            ./deploy.sh && \
            rm ~/deploy.tar.gz
          "
