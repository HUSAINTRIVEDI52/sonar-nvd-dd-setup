name: Deploy to GCP VM

on:
  push:
    branches:
      - main
      - test

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Generate .env file
        run: |
          echo "SONAR_DB_PASSWORD=${{ secrets.SONAR_DB_PASSWORD }}" > .env
          echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
          echo "DOJO_DB_PASSWORD=${{ secrets.DOJO_DB_PASSWORD }}" >> .env
          echo "DD_SECRET_KEY=${{ secrets.DD_SECRET_KEY }}" >> .env
          echo "NVD_API_KEY=${{ secrets.NVD_API_KEY }}" >> .env

      - name: Copy files to VM
        run: |
          gcloud compute scp --quiet docker-compose.yml deploy.sh .env ${{ secrets.GCP_VM_NAME }}:~/setup-pipeline/ --zone ${{ secrets.GCP_ZONE }}

      - name: Run Deployment Script
        run: |
          gcloud compute ssh --quiet ${{ secrets.GCP_VM_NAME }} --zone ${{ secrets.GCP_ZONE }} --command "chmod +x ~/setup-pipeline/deploy.sh && ~/setup-pipeline/deploy.sh"
