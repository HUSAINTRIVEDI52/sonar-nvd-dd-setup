name: Deploy to GCP VM

on:
  push:
    branches:
      - main
      - test

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure gcloud Project
        run: |
          gcloud config set project ${{ secrets.GCP_PROJECT_ID }}
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

      - name: Auto-detect VM Zone
        id: detect-zone
        run: |
          echo "Looking for VM: ${{ secrets.GCP_VM_NAME }}"
          ZONE=$(gcloud compute instances list \
            --project ${{ secrets.GCP_PROJECT_ID }} \
            --filter="name=${{ secrets.GCP_VM_NAME }}" \
            --format="value(zone)")
          if [ -z "$ZONE" ]; then
            echo "ERROR: Could not find VM '${{ secrets.GCP_VM_NAME }}' in project '${{ secrets.GCP_PROJECT_ID }}'"
            echo "Available VMs:"
            gcloud compute instances list --project ${{ secrets.GCP_PROJECT_ID }}
            exit 1
          fi
          echo "Detected zone: $ZONE"
          echo "zone=$ZONE" >> $GITHUB_OUTPUT

      - name: Warm-up SSH (Trigger Key Propagation)
        run: |
          gcloud compute ssh ${{ secrets.GCP_VM_NAME }} \
            --project ${{ secrets.GCP_PROJECT_ID }} \
            --zone ${{ steps.detect-zone.outputs.zone }} \
            --quiet \
            --command "echo 'SSH Key Handshake Initiated'" || true
          echo "Waiting 15 seconds for SSH keys to propagate..."
          sleep 15

      - name: Get Current Date for Cache
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Cache NVD Database
        id: cache-nvd
        uses: actions/cache@v4
        with:
          path: nvd_database.json
          key: nvd-db-${{ steps.date.outputs.date }}
          restore-keys: |
            nvd-db-

      - name: Download Complete NVD Database
        if: steps.cache-nvd.outputs.cache-hit != 'true'
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          python3 - << 'PYEOF'
          import os, requests, json, time
          api_key = os.getenv('NVD_API_KEY', '').strip()
          headers = {'apiKey': api_key} if api_key else {}
          base_url = "https://services.nvd.nist.gov/rest/json/cves/2.0"
          start_index = 0
          results_per_page = 2000
          with open('nvd_database.json', 'w') as f:
              f.write('{"vulnerabilities": [\n')
              first = True
              while True:
                  try:
                      url = f"{base_url}?startIndex={start_index}&resultsPerPage={results_per_page}"
                      print(f"Fetching {start_index}...", flush=True)
                      response = requests.get(url, headers=headers, timeout=30)
                      if response.status_code in [403, 503, 429, 502, 504]:
                          print(f"Rate limited ({response.status_code}), sleeping 15s...", flush=True)
                          time.sleep(15)
                          continue
                      response.raise_for_status()
                      data = response.json()
                      cves = data.get('vulnerabilities', [])
                      for cve in cves:
                          if not first: f.write(',\n')
                          json.dump(cve, f)
                          first = False
                      total_results = data.get('totalResults', 0)
                      start_index += len(cves)
                      if start_index >= total_results or len(cves) == 0: break
                      time.sleep(1)
                  except Exception as e:
                      print(f"Error: {e}. Retrying in 10s...", flush=True)
                      time.sleep(10)
              f.write('\n]}')
          print(f"Downloaded {start_index} CVEs to nvd_database.json")
          PYEOF

      - name: Generate .env and Package
        run: |
          printf 'DB_PASSWORD=%s\n' '${{ secrets.DB_PASSWORD }}' > .env
          printf 'DD_SECRET_KEY=%s\n' '${{ secrets.DD_SECRET_KEY }}' >> .env
          printf 'DD_ADMIN_PASSWORD=Admin@123456\n' >> .env
          printf 'NVD_API_KEY=%s\n' '${{ secrets.NVD_API_KEY }}' >> .env
          chmod +x remote_exec.sh
          tar -czvf deploy.tar.gz \
            docker-compose.yml \
            deploy.sh \
            init-db.sh \
            .env \
            remote_exec.sh \
            nvd_database.json

      - name: Transfer Package to VM
        run: |
          gcloud compute scp deploy.tar.gz \
            ${{ secrets.GCP_VM_NAME }}:~/ \
            --project ${{ secrets.GCP_PROJECT_ID }} \
            --zone ${{ steps.detect-zone.outputs.zone }}

      - name: Execute Deployment on VM
        run: |
          gcloud compute ssh ${{ secrets.GCP_VM_NAME }} \
            --project ${{ secrets.GCP_PROJECT_ID }} \
            --zone ${{ secrets.GCP_ZONE }} \
            --command "bash ~/remote_exec.sh"