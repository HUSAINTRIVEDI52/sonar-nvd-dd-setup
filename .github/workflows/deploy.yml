name: Deploy to GCP VM

on:
  push:
    branches:
      - main
      - test

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure gcloud Project
        run: |
          gcloud config set project ${{ secrets.GCP_PROJECT_ID }}
          gcloud config set compute/zone ${{ secrets.GCP_ZONE }}
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

      - name: Warm-up SSH (Trigger Key Propagation)
        run: |
          # Sandbox environments use metadata SSH keys which take time to propagate.
          # We must trigger the key creation and wait 15 seconds before proceeding.
          gcloud compute ssh ${{ secrets.GCP_VM_NAME }} --quiet --command "echo 'SSH Key Handshake Initiated'" || true
          echo "Waiting 15 seconds for SSH keys to propagate to the sandbox instance..."
          sleep 15

      - name: Download Complete NVD Database
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          cat << 'EOF' > download_nvd.py
          import os, requests, json, time
          api_key = os.getenv('NVD_API_KEY')
          headers = {'apiKey': api_key} if api_key else {}
          base_url = "https://services.nvd.nist.gov/rest/json/cves/2.0"
          start_index = 0
          results_per_page = 2000
          with open('nvd_database.json', 'w') as f:
              f.write('{"vulnerabilities": [\n')
              first = True
              while True:
                  try:
                      url = f"{base_url}?startIndex={start_index}&resultsPerPage={results_per_page}"
                      print(f"Fetching {start_index}...", flush=True)
                      response = requests.get(url, headers=headers, timeout=30)
                      if response.status_code in [403, 503, 429, 502, 504]:
                          print(f"Server busy or rate limited ({response.status_code}), sleeping 15 seconds...", flush=True)
                          time.sleep(15)
                          continue
                      response.raise_for_status()
                      data = response.json()
                      cves = data.get('vulnerabilities', [])
                      for cve in cves:
                          if not first: f.write(',\n')
                          json.dump(cve, f)
                          first = False
                      total_results = data.get('totalResults', 0)
                      start_index += len(cves)
                      if start_index >= total_results or len(cves) == 0: break
                      time.sleep(1) # NIST rate limit allows ~1.6 req/sec with an API key
                  except Exception as e:
                      print(f"Error: {e}. Retrying in 10 seconds...", flush=True)
                      time.sleep(10)
              f.write('\n]}')
          print(f"Successfully downloaded {start_index} CVEs to nvd_database.json")
          EOF
          pip3 install requests
          python3 download_nvd.py

      - name: Generate .env and Package
        run: |
          # Create the .env file with secrets
          echo "SONAR_DB_PASSWORD=${{ secrets.SONAR_DB_PASSWORD }}" > .env
          echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
          echo "DOJO_DB_PASSWORD=${{ secrets.DOJO_DB_PASSWORD }}" >> .env
          echo "DD_SECRET_KEY=${{ secrets.DD_SECRET_KEY }}" >> .env
          echo "NVD_API_KEY=${{ secrets.NVD_API_KEY }}" >> .env
          
          # Create execution script (avoids SSH inline parsing errors)
          cat << 'EOF' > remote_exec.sh
          #!/bin/bash
          set -e
          echo "Starting remote execution..."
          mkdir -p ~/setup-pipeline
          tar -xzvf ~/deploy.tar.gz -C ~/setup-pipeline/
          chmod +x ~/setup-pipeline/deploy.sh
          cd ~/setup-pipeline/
          ./deploy.sh
          rm -f ~/deploy.tar.gz ~/remote_exec.sh
          echo "Deployment successful!"
          EOF
          chmod +x remote_exec.sh
          
          # Bundle everything into a single archive
          tar -czvf deploy.tar.gz docker-compose.yml deploy.sh .env remote_exec.sh nvd_database.json

      - name: Transfer Package to VM
        run: |
          # Use standard SCP (Do NOT use IAP as sandbox IAM doesn't support it)
          gcloud compute scp deploy.tar.gz remote_exec.sh ${{ secrets.GCP_VM_NAME }}:~/

      - name: Execute Deployment on VM
        run: |
          # Run the script directly
          gcloud compute ssh ${{ secrets.GCP_VM_NAME }} --command "bash ~/remote_exec.sh"